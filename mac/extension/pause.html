<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Focus Guard</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0E1116; color: #AEB6C2; font: 17px -apple-system, system-ui, sans-serif; text-align: center; }
  main { width: 360px; }
  h1 { color: #fff; font-size: 30px; margin: 0 0 12px; }
  #count { color: #7DD3FC; font-size: 72px; margin: 36px 0; }
  button { display: block; width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 14px;
           font-size: 17px; cursor: pointer; }
  #back { background: #7DD3FC; color: #0E1116; }
  #go { background: #1F2937; color: #fff; }
  #go:disabled { opacity: .35; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="breathe">Take a breath. Do you really need this now?</div>
  <div id="count"></div>
  <div id="info"></div>
  <button id="back">Go back</button>
  <button id="go" disabled></button>
</main>
<script src="pause.js"></script>
</body>
</html>
