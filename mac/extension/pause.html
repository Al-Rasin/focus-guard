<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Focus Guard</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { display: flex; justify-content: center; text-align: center; overflow-x: hidden; }
  #wash { position: fixed; inset: 0; pointer-events: none; background: #0A84FF; opacity: 0; z-index: -1; }
  main { width: 100%; max-width: 440px; padding: 28px 20px 32px; box-sizing: border-box; display: flex;
         flex-direction: column; align-items: center; min-height: 100vh; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
          background: var(--surf1); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .pill b { color: #fff; font-weight: 600; }
  .pill svg { width: 16px; height: 16px; }
  #question { font-size: 24px; font-weight: 300; color: #fff; line-height: 1.3; margin: 22px 4px 4px; }
  #orbBox { position: relative; margin: 10px 0 4px; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  #orb { display: block; }
  #lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #lock svg { width: 22%; height: 22%; opacity: .9; }
  #word { font-size: 32px; font-weight: 300; color: #fff; margin-top: 6px; transition: opacity .35s; }
  #sub { font-size: 15px; color: var(--muted); margin-top: 4px; transition: opacity .35s; min-height: 1.3em; }
  #hint { font-size: 13px; color: var(--muted); margin-top: 14px; }
  #panel { width: 100%; opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .5s;
           display: flex; flex-direction: column; gap: 12px; margin-top: 8px; text-align: left; }
  #panel.on { opacity: 1; transform: none; }
  .badge { align-self: center; color: var(--green); background: var(--green-box); border-radius: 999px;
           padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .swap { background: var(--green-box); border: 1px solid rgba(48,209,88,.28); border-radius: 16px; padding: 12px 14px; }
  .swap .overline { color: var(--green); }
  .swap div:last-child { color: #fff; font-size: 16px; margin-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--surf2); border: 1px solid var(--line); color: #fff; border-radius: 999px;
          padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .chip:hover { background: var(--surf3); }
  .chip.big { flex: 1; padding: 12px 0; font-size: 16px; font-weight: 600; text-align: center; }
  .gated { opacity: .4; pointer-events: none; transition: opacity .3s; }
  #why { width: 100%; box-sizing: border-box; }
  .closedTitle { font-size: 30px; font-weight: 300; color: #fff; margin-top: 8px; }
  .reason { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .count { font-size: 44px; font-weight: 200; color: #fff; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tiles { display: flex; gap: 10px; width: 100%; margin-top: 18px; }
  .tile { flex: 1; background: var(--surf1); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
          text-align: left; }
  .tile b { display: block; font-size: 22px; font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--muted); }
  .grow { flex: 1; min-height: 20px; }
  .bottom { width: 100%; margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="wash"></div>
<main id="main"></main>
<script src="guide.js"></script>
<script src="pause.js"></script>
</body>
</html>
